<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Scripts and experiments by Roshaun.">
    <title>Roshaun's Website</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header class="top-bar" style="flex-direction: row">
        <nav class="nav-container" aria-label="Main navigation">
            <strong style="align-self: center">Roshaun's Website</strong>
            <a class="nav-btn active buttonlike" href="/">Home</a>
            <a class="nav-btn buttonlike" href="/list/scripts">Scripts</a>
            <a class="nav-btn buttonlike" href="/list/projects">Projects</a>
        <a class="nav-btn buttonlike" href="/homelab">Homelab</a>
        </nav>
    </header>

    <main class="main-container">
        <section class="card intro-card">
            <h1>Roshaun's Website</h1>
            <p>Hi! Welcome to my website. Check out the scripts and experiments I've made.</p>
            <a class="scroll-link" href="#scripts">Explore scripts ↓</a>
        </section>

        <section class="scripts-section" id="scripts" aria-labelledby="scripts-heading">
            <div class="section-heading">
                <div>
                    <h2 id="scripts-heading">Scripts</h2>
                    <p>Things I've built and experiments I've tried.</p>
                </div>
                <span id="script-count" class="script-count" aria-live="polite"></span>
            </div>
            <div id="items" class="script-grid" aria-live="polite">
                <p class="state-message">Loading scripts…</p>
            </div>
        </section>
    </main>

    <script>
    (() => {
        const container = document.getElementById('items');
        const count = document.getElementById('script-count');

        function showMessage(message, className = 'state-message') {
            container.replaceChildren();
            const paragraph = document.createElement('p');
            paragraph.className = className;
            paragraph.textContent = message;
            container.appendChild(paragraph);
        }

        function makeScriptCard(script) {
            const article = document.createElement('article');
            article.className = 'card script-card';

            const type = document.createElement('span');
            type.className = 'script-type';
            type.textContent = script['exec-type'] === 'html' ? 'HTML script' : 'Console script';

            const title = document.createElement('h3');
            title.textContent = script.name || script.id;

            const description = document.createElement('p');
            description.textContent = script.desc || 'No description provided yet.';

            const link = document.createElement('a');
            link.className = 'script-link';
            const scriptUrl = script['exec-type'] === 'script' ? '/script/' : '/script/';
            link.href = scriptUrl + encodeURIComponent(script.id);
            link.textContent = script['exec-type'] === 'html' ? 'Open script →' : 'Open console →';

            article.append(type, title, description, link);
            return article;
        }

        async function loadScripts() {
            try {
                const response = await fetch('/api/scripts', {
                    headers: { 'Accept': 'application/json' }
                });
                if (!response.ok) throw new Error('The script API returned HTTP ' + response.status);

                const scripts = await response.json();
                if (!Array.isArray(scripts)) throw new Error('The script API returned an invalid response');

                count.textContent = scripts.length + (scripts.length === 1 ? ' script' : ' scripts');
                if (scripts.length === 0) {
                    showMessage('No scripts have been published yet.');
                    return;
                }

                container.replaceChildren(...scripts.map(makeScriptCard));
            } catch (error) {
                console.error('Unable to load scripts:', error);
                showMessage('Scripts could not be loaded. Please try again later.');
            }
        }

        loadScripts();
    })();
    </script>
</body>
</html>
