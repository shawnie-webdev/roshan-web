<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Script console</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

<header class="top-bar">
    <nav class="nav-container" aria-label="Main navigation">
        <strong style="align-self: center">Roshaun's Website</strong>
        <a class="nav-btn active buttonlike" href="/">Home</a>
        <a class="nav-btn buttonlike" href="/list/scripts">Scripts</a>
        <a class="nav-btn buttonlike" href="/list/projects">Projects</a>
    </nav>
</header>

<main class="console-container">
    <section class="card console-card">
        <span class="script-type">Console script</span>
        <h1 id="script-name">Loading script…</h1>
        <p id="script-description"></p>
        <div class="console-window" aria-label="Script source viewer">
            <div class="console-bar"><span></span><span></span><span></span><strong id="file-name">Loading source</strong></div>
            <pre id="source" class="console-output">Loading script source…</pre>
        </div>
        <p class="console-note">This view loads the script's main source file. It does not execute server-side commands.</p>
    </section>
</main>
<script>
    (async () => {
        const scriptId = decodeURIComponent(window.location.pathname.split('/').filter(Boolean).pop() || '');
        const title = document.getElementById('script-name');
        const description = document.getElementById('script-description');
        const source = document.getElementById('source');
        const fileName = document.getElementById('file-name');

        try {
            const response = await fetch('/api/script/console?script=' + encodeURIComponent(scriptId));
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Unable to load script');

            document.title = data.name + ' · Console';
            title.textContent = data.name;
            description.textContent = data.desc || '';
            fileName.textContent = data.main;
            source.textContent = data.source;
        } catch (error) {
            title.textContent = 'Unable to load script';
            source.textContent = error.message;
            fileName.textContent = 'Error';
        }
    })();
</script>
</body>
</html>
